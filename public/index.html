<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VEYROX Dashboard</title>
    <style>
        :root {
            --bg: #0f1015;
            --card: #16171e;
            --card-border: #23242c;
            --text: #e8e8ea;
            --text-dim: #9a9aa5;
            --accent: #5865f2;
            --good: #43b581;
            --warn: #faa61a;
            --bad: #f04747;
        }
        html[data-theme="light"] {
            --bg: #f2f3f5;
            --card: #ffffff;
            --card-border: #e3e5e8;
            --text: #1e1f22;
            --text-dim: #5c5e66;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            position: relative;
        }

        /* Wallpaper sits behind everything; a scrim keeps text legible
           over arbitrary user-picked images. */
        #wallpaper {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            z-index: 0;
            transition: background-image 0.3s ease;
        }
        #wallpaper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(15,16,21,0.72), rgba(15,16,21,0.86));
        }
        html[data-theme="light"] #wallpaper::after {
            background: linear-gradient(180deg, rgba(242,243,245,0.75), rgba(242,243,245,0.9));
        }

        #shell { position: relative; z-index: 1; padding: 20px; max-width: 640px; margin: 0 auto; }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
        .header-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .header-title h1 { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #guildIcon { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; }
        .header-actions { display: flex; gap: 8px; flex-shrink: 0; }

        .participant-row { display: flex; align-items: center; gap: -6px; margin-bottom: 16px; min-height: 24px; }
        .participant-avatar {
            width: 26px; height: 26px; border-radius: 50%;
            border: 2px solid var(--bg); margin-left: -8px;
        }
        .participant-avatar:first-child { margin-left: 0; }
        .participant-more { margin-left: 4px; font-size: 12px; color: var(--text-dim); }
        .icon-btn {
            background: var(--card);
            border: 1px solid var(--card-border);
            color: var(--text);
            width: 34px; height: 34px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 15px;
        }
        .icon-btn:hover { border-color: var(--accent); }

        .range-toggle { display: flex; gap: 6px; margin-bottom: 16px; }
        .range-toggle button {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--card-border);
            color: var(--text-dim);
            padding: 8px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
        }
        .range-toggle button.active { color: var(--text); border-color: var(--accent); background: rgba(88,101,242,0.12); }

        .score-ring {
            display: flex; flex-direction: column; align-items: center;
            padding: 24px; background: var(--card); border: 1px solid var(--card-border);
            border-radius: 16px; margin-bottom: 16px; position: relative;
        }
        .ring-svg { transform: rotate(-90deg); }
        .ring-track { fill: none; stroke: var(--card-border); stroke-width: 10; }
        .ring-fill {
            fill: none; stroke-width: 10; stroke-linecap: round;
            transition: stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .score-number {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 34px; font-weight: 800; line-height: 1;
        }
        .score-label { color: var(--text-dim); margin-top: 10px; font-size: 13px; }

        .trend { margin-top: 12px; width: 100%; }
        #trendCanvas { width: 100%; height: 48px; display: block; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .stat-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; }
        .stat-card .value { font-size: 24px; font-weight: 700; }
        .stat-card .label { color: var(--text-dim); font-size: 12px; margin-top: 4px; }

        .breakdown { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .breakdown h2, .cases h2 { font-size: 14px; margin-bottom: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
        .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
        .bar-row .bar-label { width: 70px; flex-shrink: 0; text-transform: capitalize; color: var(--text-dim); }
        .bar-track { flex: 1; background: var(--card-border); border-radius: 6px; height: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--accent); }
        .bar-count { width: 24px; text-align: right; color: var(--text-dim); }

        .cases { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .cases-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
        .cases-header h2 { margin-bottom: 0; }
        #userSearch {
            background: var(--bg); border: 1px solid var(--card-border); color: var(--text);
            padding: 6px 10px; border-radius: 8px; font-size: 12px; width: 140px;
        }
        .case-row { padding: 8px 0; border-bottom: 1px solid var(--card-border); font-size: 13px; cursor: pointer; }
        .case-row:last-child { border-bottom: none; }
        .case-row-summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .case-action { font-weight: 600; text-transform: uppercase; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--card-border); flex-shrink: 0; }
        .case-reason { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .case-row-detail { margin-top: 8px; padding: 10px; background: var(--bg); border-radius: 8px; font-size: 12px; line-height: 1.6; color: var(--text-dim); }
        .case-row-detail code { color: var(--text); }
        .pager { display: flex; justify-content: space-between; margin-top: 12px; }
        .pager button {
            background: transparent; border: 1px solid var(--card-border); color: var(--text);
            padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
        }
        .pager button:disabled { opacity: 0.4; cursor: default; }

        .mod-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .mod-actions button {
            flex: 1; min-width: 70px;
            padding: 10px; border-radius: 10px; border: 1px solid var(--card-border);
            background: var(--card); color: var(--text); font-size: 13px; cursor: pointer;
        }
        .mod-actions button:hover { border-color: var(--accent); }
        .mod-actions button.danger:hover { border-color: var(--bad); color: var(--bad); }
        .mod-hint { font-size: 11px; color: var(--text-dim); text-align: center; margin: -8px 0 16px; }

        .loading, .error { text-align: center; padding: 40px; color: var(--text-dim); }
        .error { color: var(--bad); }

        #toastHost {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            z-index: 20; display: flex; flex-direction: column; gap: 8px; align-items: center;
        }
        .toast {
            background: var(--card); border: 1px solid var(--card-border); color: var(--text);
            padding: 10px 16px; border-radius: 10px; font-size: 13px;
            opacity: 0; transform: translateY(8px); transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { border-color: var(--good); }
        .toast-error { border-color: var(--bad); }

        /* Wallpaper picker panel */
        #wallpaperPanel {
            position: fixed; inset: 0; z-index: 10;
            background: rgba(0,0,0,0.5);
            display: none; align-items: flex-end; justify-content: center;
        }
        #wallpaperPanel.open { display: flex; }
        .panel-sheet {
            background: var(--card); border: 1px solid var(--card-border);
            border-radius: 16px 16px 0 0; padding: 20px; width: 100%; max-width: 640px;
        }
        .panel-sheet h2 { font-size: 15px; margin-bottom: 12px; }
        .preset-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
        .preset-swatch {
            aspect-ratio: 1; border-radius: 10px; cursor: pointer; border: 2px solid transparent;
            background-size: cover; background-position: center;
        }
        .preset-swatch.selected { border-color: var(--accent); }
        .preset-swatch[data-preset="none"] { background: var(--card-border); }
        .preset-swatch[data-preset="aurora"] { background: linear-gradient(135deg, #43b581, #5865f2); }
        .preset-swatch[data-preset="midnight"] { background: linear-gradient(135deg, #0f1015, #23242c); }
        .preset-swatch[data-preset="circuit"] { background: linear-gradient(135deg, #23242c, #5865f2, #0f1015); }
        .preset-swatch[data-preset="nebula"] { background: linear-gradient(135deg, #f04747, #5865f2, #43b581); }
        .custom-url-row { display: flex; gap: 8px; }
        .custom-url-row input {
            flex: 1; background: var(--bg); border: 1px solid var(--card-border); color: var(--text);
            padding: 10px 12px; border-radius: 10px; font-size: 13px;
        }
        .custom-url-row button, .panel-close {
            background: var(--accent); color: white; border: none; border-radius: 10px;
            padding: 10px 16px; font-size: 13px; cursor: pointer;
        }
        .panel-close { width: 100%; margin-top: 14px; background: transparent; color: var(--text-dim); border: 1px solid var(--card-border); }
        .panel-error { color: var(--bad); font-size: 12px; margin-top: 6px; min-height: 14px; }
    </style>
</head>
<body>
    <div id="wallpaper"></div>

    <div id="shell">
        <div class="header">
            <div class="header-title">
                <img id="guildIcon" alt="" style="display:none" />
                <h1 id="guildName">🛡️ VEYROX Dashboard</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="wallpaperBtn" title="Change wallpaper">🖼️</button>
            </div>
        </div>

        <div id="participantRow" class="participant-row"></div>

        <div class="range-toggle" id="rangeToggle">
            <button data-days="7">7d</button>
            <button data-days="30" class="active">30d</button>
            <button data-days="90">90d</button>
        </div>

        <div id="content">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <div id="wallpaperPanel">
        <div class="panel-sheet">
            <h2>Wallpaper</h2>
            <div class="preset-grid" id="presetGrid">
                <div class="preset-swatch" data-preset="none" title="None"></div>
                <div class="preset-swatch" data-preset="aurora" title="Aurora"></div>
                <div class="preset-swatch" data-preset="midnight" title="Midnight"></div>
                <div class="preset-swatch" data-preset="circuit" title="Circuit"></div>
                <div class="preset-swatch" data-preset="nebula" title="Nebula"></div>
            </div>
            <div class="custom-url-row">
                <input type="url" id="customWallpaperUrl" placeholder="https://... custom image URL" />
                <button id="applyCustomWallpaper">Apply</button>
            </div>
            <div class="panel-error" id="wallpaperError"></div>
            <button class="panel-close" id="closeWallpaperPanel">Close</button>
        </div>
    </div>

    <script type="module" src="/app.js"></script>
</body>
</html>
